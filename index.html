<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Premium Home Solutions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

<!-- NAV -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">Premium Home Solutions</a>
    </div>
</nav>

<!-- ESTIMATOR -->
<section id="estimator" class="estimator-section">
    <div class="container">
        <h2 class="section-title">Get Your Free Estimation</h2>

        <form id="estimationForm" onsubmit="return false;">
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Service *</label>
                    <select id="serviceType" class="form-select" required>
                        <option value="">Select</option>
                        <option value="mesh">Mosquito Mesh</option>
                        <option value="invisible">Invisible Grill</option>
                        <option value="upvc">UPVC Windows</option>
                        <option value="hanger">Cloth Hanger</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label id="dimensionLabel" class="form-label">Width (ft) *</label>
                    <input id="width" type="number" class="form-control" min="1">
                </div>

                <div class="col-md-6">
                    <label id="heightLabel" class="form-label">Height (ft) *</label>
                    <input id="height" type="number" class="form-control" min="1">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Quantity *</label>
                    <input id="quantity" type="number" class="form-control" value="1" min="1">
                </div>

                <div id="addonsSection" class="col-12" style="display:none;">
                    <h5>Add-ons</h5>
                    <div id="addonsContainer"></div>
                </div>

                <div class="col-12">
                    <button id="calcBtn" type="button" class="btn btn-primary w-100">
                        Calculate Estimation
                    </button>
                </div>

            </div>
        </form>

        <div id="estimationResult" class="result-card mt-4"></div>
    </div>
</section>

<!-- IMAGE MODAL -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body text-center">
                <img id="modalImage" class="img-fluid">
            </div>
        </div>
    </div>
</div>

<!-- VIDEO MODAL -->
<div class="modal fade" id="videoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="videoModalTitle"></h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <video id="modalVideo" controls class="w-100"></video>
            </div>
        </div>
    </div>
</div>

<!-- FLOATING BUTTON -->
<div id="whatsapp-chatbot"></div>

<!-- SCRIPTS (ORDER MATTERS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/estimator.js"></script>
<script src="js/modal.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/script.js"></script>

</body>
</html>
